title: Impacket wmiexec Style Command via WmiPrvSE
status: experimental
description: Detects cmd.exe spawned by wmiprvse.exe redirecting output to an ADMIN$ share, the Impacket wmiexec pattern.
references:
    - https://attack.mitre.org/techniques/T1047/
author: Hrishikesh
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: "\\wmiprvse.exe"
        Image|endswith: "\\cmd.exe"
        CommandLine|contains|all:
            - "/Q"
            - "/c"
            - "ADMIN$"
    condition: selection
falsepositives:
    - Legitimate admin tooling that redirects output to ADMIN$
level: high
tags:
    - attack.execution
    - attack.t1047
    - attack.lateral_movement
    - attack.t1021.002
