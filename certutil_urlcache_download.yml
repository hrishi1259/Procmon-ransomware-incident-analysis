title: Certutil Used to Download a File
status: experimental
description: Detects certutil -urlcache -split -f, a LOLBin download technique.
author: Hrishikesh
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: "\\certutil.exe"
        CommandLine|contains|all:
            - "urlcache"
            - "http"
    condition: selection
falsepositives:
    - Rare legitimate certificate retrieval
level: high
tags:
    - attack.command_and_control
    - attack.t1105
